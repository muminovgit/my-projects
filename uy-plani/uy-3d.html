<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uy plani — 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f4; font-family: Inter, "Segoe UI", Arial, sans-serif; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(255,255,255,.92); padding: 10px 12px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #ui h1 { font-size: 16px; margin: 0 0 6px; }
  #ui p { font-size: 12px; margin: 0 0 8px; color: #555; }
  #ui button { font: inherit; font-size: 12px; margin: 2px 2px 0 0; padding: 5px 9px; border: 1px solid #bbb; background: #fff; border-radius: 6px; cursor: pointer; }
  #ui button.on { background: #2f6fb0; color: #fff; border-color: #2f6fb0; }
  .lbl { font-size: 12px; font-weight: 700; color: #222; background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 4px; white-space: nowrap; text-align: center; line-height: 1.25; }
  .lbl span { display: block; font-weight: 400; color: #666; font-size: 11px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <h1>Uy plani — 3D</h1>
  <p>7,60 × 20,00 m · 2 qavat + eski uy · sichqoncha bilan aylantiring</p>
  <button id="bEye" class="on">Ko'chadan</button>
  <button id="bYard">Hovlidan</button>
  <button id="bF1">1-qavat</button>
  <button id="bF2">2-qavat</button>
  <button id="bTop">Yuqoridan</button>
  <br>
  <button id="bWalls">Devorlar: baland</button>
  <button id="bLbl" class="on">Nomlar</button>
  <button id="bRaw">Remontsiz</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const W = 7.6, H = 16.5, TO = 0.4, TI = 0.2;
const ZN = -3.5, GL = -1.0;  // ZN — darvozaxona qismining shimoliy cheti, GL — hovli/ko'cha sathi (pol 0 da)
const WALL_H = 2.8, DOOR_H = 2.1, SILL = 0.9, WIN_TOP = 2.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#eef1f4');
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', top: 0, left: 0, pointerEvents: 'none' });
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(W / 2, 0, H / 2);
controls.maxPolarAngle = Math.PI / 2.05;
controls.enableDamping = true;

// yorug'lik
scene.add(new THREE.HemisphereLight('#ffffff', '#b9b2a6', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2);
sun.position.set(14, 22, 12);
sun.target.position.set(W / 2, 0, (ZN + H) / 2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 70 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// yer
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#cfd8c4' }));
ground.rotation.x = -Math.PI / 2;
ground.position.set(W / 2, GL - 0.02, H / 2);
ground.receiveShadow = true;
scene.add(ground);

const mats = {};
const mat = (c, o = {}) => mats[c + JSON.stringify(o)] ??= new THREE.MeshStandardMaterial({ color: c, roughness: .85, ...o });

let target = scene, BY = 0;  // BY — qavat balandligi (2-qavat uchun U0)
const floors = [];
// plan koordinatalari: x -> x, y (plan) -> z
function box(x, z, w, d, h, color, y0 = 0, o = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, o));
  m.position.set(x + w / 2, BY + y0 + h / 2, z + d / 2);
  m.castShadow = m.receiveShadow = true;
  target.add(m);
  return m;
}

// ---------- pol ----------
const ROOMS = [
  ['Yotoqxona 1', 1.8, 0, 5.8, 3.5, '#d9b88f'],
  ['Sanuzel', 0, 0, 1.8, 3.5, '#bcd3de'],
  ['Yotoqxona 2', 0, 3.5, 4.0, 3.0, '#d9b88f'],
  ['Zina', 0, 6.5, 1.5, 3.0, '#c9c9c9'],
  ['Hammom', 1.5, 6.5, 2.5, 1.8, '#bcd3de'],
  ['Dahliz', 1.5, 8.3, 2.5, 1.2, '#d8d4c8'],
  ['Yotoqxona 3', 0, 9.5, 4.0, 3.5, '#d9b88f'],
  ['Mehmonxona (zal)', 4.0, 3.5, 3.6, 9.5, '#c8a77c'],
  ['Ovqatlanish xonasi', 0, 13, 5.0, 3.5, '#e2d3b0'],
  ['Oshxona', 5.0, 13, 2.6, 3.5, '#e2d3b0'],
];
const labels = [], labels2 = [];
function addRooms(rooms, lbl, list, grp) {
  for (const [n, x, z, w, d, c] of rooms) {
    const f = box(x, z, w, d, 0.05, c);
    f.material = f.material.clone();
    f.userData.color = c;
    floors.push(f);
    const el = document.createElement('div');
    el.className = 'lbl';
    el.innerHTML = n === 'Zina' ? n : `${n}<span>${(w * d).toFixed(1)} m²</span>`;
    const o = new CSS2DObject(el);
    o.position.set(lbl[n][0], BY + 0.3, lbl[n][1]);
    grp.add(o);
    list.push(o);
  }
}
addRooms(ROOMS, {
  'Yotoqxona 1': [4.4, 2.9], 'Sanuzel': [0.9, 1.8], 'Yotoqxona 2': [3.0, 5.4], 'Zina': [0.95, 8.0],
  'Hammom': [3.3, 7.6], 'Dahliz': [2.75, 8.9], 'Yotoqxona 3': [3.0, 11.0], 'Mehmonxona (zal)': [5.8, 8.0],
  'Ovqatlanish xonasi': [2.2, 15.7], 'Oshxona': [5.8, 14.6],
}, labels, scene);
BY = GL;
addRooms([['Darvozaxona', TO, ZN + TO, W - TO, -ZN - TO, '#b9b4ab']], { 'Darvozaxona': [W / 2, ZN / 2] }, labels, scene);
BY = 0;

// ---------- devorlar ----------
const wallMeshes = [];
const WALL_C = '#f2efe9';
const glass = mat('#9cc8e8', { transparent: true, opacity: .45, roughness: .1, metalness: .1 });

// o: [{a, b, t:'d'|'w'}] — devor bo'ylab teshiklar
function wall(axis, pos, from, to, t, openings = []) {
  const seg = (a, b, y0, h) => {
    if (b - a <= 0.001 || h <= 0) return;
    const m = axis === 'h' ? box(a, pos, b - a, t, h, WALL_C, y0) : box(pos, a, t, b - a, h, WALL_C, y0);
    m.userData = { y0: BY + y0, h, lvl: BY > 0 ? 2 : 1 };
    wallMeshes.push(m);
  };
  let cur = from;
  for (const op of [...openings].sort((p, q) => p.a - q.a)) {
    seg(cur, op.a, 0, WALL_H);
    if (op.t === 'w') {
      seg(op.a, op.b, 0, SILL);
      seg(op.a, op.b, WIN_TOP, WALL_H - WIN_TOP);
      const g = new THREE.Mesh(new THREE.BoxGeometry(axis === 'h' ? op.b - op.a : 0.04, WIN_TOP - SILL, axis === 'h' ? 0.04 : op.b - op.a), glass);
      g.position.set(axis === 'h' ? (op.a + op.b) / 2 : pos + t / 2, BY + (SILL + WIN_TOP) / 2, axis === 'h' ? pos + t / 2 : (op.a + op.b) / 2);
      g.userData = { glass: true, lvl: BY > 0 ? 2 : 1 };
      target.add(g);
      wallMeshes.push(g);
    } else {
      seg(op.a, op.b, DOOR_H, WALL_H - DOOR_H);
    }
    cur = op.b;
  }
  seg(cur, to, 0, WALL_H);
}
const D = (a, b) => ({ a, b, t: 'd' }), Wn = (a, b) => ({ a, b, t: 'w' });

// tashqi devorlar
wall('h', 0, 0, W, TO, [Wn(2.6, 3.6), Wn(5.3, 6.6)]);
wall('h', H - TO, 0, W, TO, [Wn(1.6, 3.2)]);
wall('v', 0, TO, H - TO, TO, [Wn(4.3, 5.7), Wn(10.5, 11.9), Wn(14.1, 15.5)]);
wall('v', W - TO, TO, H - TO, TO, [Wn(0.9, 2.3), Wn(4.4, 6.0), D(7.4, 8.5), Wn(10.3, 11.9), Wn(14.1, 15.3)]);
// ichki devorlar
wall('h', 3.5 - TI / 2, TO, W - TO, TI, [D(6.3, 7.2)]);
wall('h', 6.5 - TI / 2, TO, 4.0, TI);
wall('h', 8.3 - TI / 2, 1.5, 4.0, TI, [D(2.6, 3.3)]);
wall('h', 9.5 - TI / 2, TO, 4.0, TI);
wall('h', 13 - TI / 2, TO, W - TO, TI, [D(4.15, 4.95), D(5.3, 6.1)]);
wall('v', 1.8 - TI / 2, TO, 3.5 - TI / 2, TI, [D(2.5, 3.2)]);
wall('v', 4.0 - TI / 2, 3.5 + TI / 2, 13 - TI / 2, TI, [D(5.4, 6.3), D(8.5, 9.4), D(9.7, 10.6)]);
wall('v', 1.5 - TI / 2, 6.5 + TI / 2, 9.5 - TI / 2, TI, [D(8.4, 9.4)]);
wall('v', 5.0 - TI / 2, 13 + TI / 2, H - TO, TI, [D(14.6, 15.4)]);

// ustunlar
function columns() {
for (const [cx, cz] of [[0, 0], [4, 0], [W, 0], [0, 3.5], [W, 3.5], [0, 6.5], [4, 6.5], [0, 9.5], [4, 9.5], [0, 13], [W, 13], [0, H], [4, H], [W, H]]) {
  const x = Math.min(Math.max(cx - .22, -0.02), W - .42), z = Math.min(Math.max(cz - .22, -0.02), H - .42);
  const m = box(x, z, .44, .44, WALL_H + .02, '#8a8580');
  m.userData = { y0: BY, h: WALL_H + .02, lvl: BY > 0 ? 2 : 1 };
  wallMeshes.push(m);
}
}
columns();


// ---------- mebel ----------
const furniture = new THREE.Group();
scene.add(furniture);
target = furniture;
const WHITE = '#fbfbf8', WOOD = '#8b5e3c', FAB = '#5b7c99', FAB2 = '#9a6a5a';
function bed(x, z, w, d, c = FAB) {
  box(x, z, w, d, 0.35, WOOD);
  box(x + 0.05, z + 0.05, w - 0.1, d - 0.1, 0.18, WHITE, 0.35);
  box(x + 0.05, z + 0.8, w - 0.1, d - 0.85, 0.06, c, 0.53);
  box(x + 0.15, z + 0.12, w / 2 - 0.25, 0.45, 0.12, '#eeeeee', 0.53);
  box(x + w / 2 + 0.1, z + 0.12, w / 2 - 0.25, 0.45, 0.12, '#eeeeee', 0.53);
  box(x, z - 0.05, w, 0.08, 1.0, WOOD);
}
const table = (x, z, w, d, h = 0.75, c = WOOD) => { box(x, z, w, d, 0.05, c, h - 0.05); for (const [a, b] of [[x, z], [x + w - .06, z], [x, z + d - .06], [x + w - .06, z + d - .06]]) box(a, b, .06, .06, h - .05, c); };
const chair = (cx, cz) => { box(cx - .2, cz - .2, .4, .4, .45, '#a0764f'); };

// Yotoqxona 1
bed(3.6, 0.5, 1.8, 2.0, FAB2);
box(2.9, 0.5, 0.5, 0.45, 0.5, WOOD); box(5.6, 0.5, 0.5, 0.45, 0.5, WOOD);
box(2.1, 2.6, 0.6, 0.7, 0.45, '#c9a27a'); box(2.1, 2.6, 0.6, 0.15, 0.8, '#c9a27a');
box(6.6, 0.6, 0.6, 1.8, 2.2, '#e6dccd');
// Sanuzel
box(0.68, 0.45, 0.45, 0.2, 0.8, WHITE); box(0.7, 0.65, 0.4, 0.6, 0.42, WHITE);
box(0.5, 2.6, 0.5, 0.45, 0.85, WHITE);
// Yotoqxona 2
bed(0.5, 4.0, 1.6, 2.0);
table(2.6, 4.0, 1.1, 0.55); chair(3.15, 4.85);
// Zina (konstruksiya — remontsiz holatda ham ko'rinadi)
target = scene;
// 11 pog'ona: 9,3 dan 7,3 gacha, 2-qavat maydonchasiga (3,1 m) chiqadi
for (let i = 0; i < 11; i++) box(0.4, 9.3 - (i + 1) * 2.0 / 11, 1.0, 2.0 / 11, 3.1 * (i + 1) / 12, '#bfb5a5');
box(0.4, 6.6, 1.0, 0.7, 0.6, '#bfb5a5');  // zina ostidagi omborcha devori
target = furniture;
// Hammom
box(1.75, 6.75, 0.75, 1.4, 0.55, WHITE);
box(1.85, 6.85, 0.55, 1.2, 0.02, '#a9d3e8', 0.54);
box(3.25, 6.75, 0.5, 0.45, 0.85, WHITE);
// Yotoqxona 3
bed(0.5, 10.0, 1.6, 2.0, '#6f8f6a');
box(0.5, 12.2, 1.8, 0.55, 2.0, '#e6dccd');
table(2.9, 11.6, 0.8, 1.1);
// Mehmonxona
box(4.35, 5.0, 0.9, 2.4, 0.42, '#7d8b6f'); box(4.35, 5.0, 0.25, 2.4, 0.85, '#7d8b6f');
box(4.35, 5.0, 0.9, 0.2, 0.6, '#7d8b6f'); box(4.35, 7.2, 0.9, 0.2, 0.6, '#7d8b6f');
box(5.4, 5.3, 1.2, 1.8, 0.01, '#b84a3a', 0.05);
table(5.6, 5.6, 0.8, 1.2, 0.4, '#5a3a24');
box(6.95, 4.9, 0.3, 2.4, 0.5, '#4a3020');
box(7.12, 5.3, 0.05, 1.6, 0.9, '#111', 0.7);
table(4.6, 9.0, 2.6, 1.7, 0.75, '#6e4529');
for (const cx of [5.0, 5.9, 6.8]) for (const cz of [8.75, 10.95]) chair(cx, cz);
box(4.35, 11.6, 0.5, 1.1, 1.8, '#e6dccd');
// Ovqatlanish
table(1.0, 13.9, 2.4, 1.0);
for (const cx of [1.5, 2.2, 2.9]) for (const cz of [13.6, 15.2]) chair(cx, cz);
// Oshxona
box(6.6, 13.95, 0.6, 2.15, 0.88, '#e9e5dd'); box(6.6, 13.95, 0.6, 2.15, 0.04, '#3b3b3b', 0.88);
box(5.3, 15.5, 1.3, 0.6, 0.88, '#e9e5dd'); box(5.3, 15.5, 1.3, 0.6, 0.04, '#3b3b3b', 0.88);
box(6.6, 13.25, 0.6, 0.6, 1.8, '#d7dadd');
box(6.75, 15.4, 0.35, 0.35, 0.02, '#9aa7b0', 0.92);

target = scene;

// ---------- tashqi fasad (rasm asosida: sariq g'isht, krem ramkalar, tosh poydevor) ----------
let seed = 7;
const rand = () => (seed = seed * 16807 % 2147483647) / 2147483647;
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const brickTex = canvasTex(256, 256, (g, w, h) => {   // 1,0 × 0,7 m
  g.fillStyle = '#e9dcc0'; g.fillRect(0, 0, w, h);
  const bw = 64, bh = 25.6;
  for (let r = 0; r < 10; r++) for (let i = -1; i < 5; i++) {
    const x = i * bw + (r % 2 ? bw / 2 : 0), y = r * bh, t = rand();
    g.fillStyle = `hsl(${34 + t * 10}, ${35 + rand() * 20}%, ${56 + rand() * 16}%)`;
    g.fillRect(x + 2, y + 2, bw - 4, bh - 4);
  }
});
const stoneTex = canvasTex(256, 160, (g, w, h) => {   // 1,0 × 0,6 m
  g.fillStyle = '#5f5a54'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    const x = rand() * w, y = rand() * h, r = 9 + rand() * 11;
    g.fillStyle = `hsl(${25 + rand() * 20}, ${4 + rand() * 10}%, ${52 + rand() * 30}%)`;
    g.beginPath(); g.ellipse(x, y, r * 1.35, r, rand() * 3, 0, 7); g.fill();
  }
});
const roofTex = canvasTex(64, 64, (g, w, h) => {      // har 0,5 m da profnastil qirrasi
  g.fillStyle = '#5c6268'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#7d848b'; g.fillRect(0, 0, w, 5);
  g.fillStyle = '#4a4f55'; g.fillRect(0, 5, w, 3);
});
const woodTex = canvasTex(128, 64, (g, w, h) => {
  g.fillStyle = '#b06a32'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 16) { g.fillStyle = `hsl(25, 55%, ${36 + rand() * 12}%)`; g.fillRect(x, 0, 14, h); }
});
function texMat(tex, rx, ry) {
  const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry);
  return new THREE.MeshStandardMaterial({ map: t, roughness: .9 });
}
const CREAM = '#efe4c8', FRAME = '#6b3a1f';
const PLINTH = 0.6;
const upper = new THREE.Group(); scene.add(upper);
const roof = new THREE.Group(); scene.add(roof);

function mbox(x, y, z, w, h, d, material, grp, reg = false) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x + w / 2, y + h / 2, z + d / 2);
  m.castShadow = m.receiveShadow = true;
  grp.add(m);
  if (reg) { m.userData = { y0: y, h, lvl: y >= WALL_H - 0.01 ? 2 : 1 }; wallMeshes.push(m); }
  return m;
}
// tomon bo'yicha: s = 'E' (ko'cha, x=W), 'W' (x=0), 'N' (z=0), 'S' (z=H); a..b devor bo'ylab, k — chiqib turishi
function sbox(s, a, b, y0, y1, k, material, grp, reg, off = 0) {
  const L = b - a, h = y1 - y0;
  if (L <= 0.001 || h <= 0.001) return;
  if (s === 'E') return mbox(W + off, y0, a, k, h, L, material, grp, reg);
  if (s === 'W') return mbox(-k - off, y0, a, k, h, L, material, grp, reg);
  if (s === 'N') return mbox(a, y0, ZN - k - off, L, h, k, material, grp, reg);
  return mbox(a, y0, H + off, L, h, k, material, grp, reg);
}
function cladPiece(s, a, b, y0, y1, grp, reg) {
  if (y0 < PLINTH) sbox(s, a, b, y0, Math.min(y1, PLINTH), 0.12, texMat(stoneTex, (b - a) / 1.0, (Math.min(y1, PLINTH) - y0) / 0.6), grp, reg);
  if (y1 > PLINTH) { const ya = Math.max(y0, PLINTH); sbox(s, a, b, ya, y1, 0.05, texMat(brickTex, (b - a) / 1.0, (y1 - ya) / 0.7), grp, reg); }
}
// teshiklar: [a, b, pastki, yuqori, turi]
function facade(s, len, y0, y1, ops, grp, reg, from = 0) {
  let cur = from;
  for (const [a, b, lo, hi, type] of [...ops].sort((p, q) => p[0] - q[0])) {
    cladPiece(s, cur, a, y0, y1, grp, reg);
    cladPiece(s, a, b, y0, lo, grp, reg);
    cladPiece(s, a, b, hi, y1, grp, reg);
    cur = b;
    // krem ramka
    const fr = 0.14, cm = mat(CREAM);
    sbox(s, a - fr, a, lo - fr, hi + fr, 0.1, cm, grp, reg);
    sbox(s, b, b + fr, lo - fr, hi + fr, 0.1, cm, grp, reg);
    sbox(s, a - fr, b + fr, hi, hi + fr, 0.1, cm, grp, reg);
    if (type === 'w') {
      sbox(s, a - fr, b + fr, lo - fr, lo, 0.14, cm, grp, reg);
      // jigarrang yog'och rom + oyna
      const fm = mat(FRAME);
      sbox(s, a, a + 0.07, lo, hi, 0.07, fm, grp, reg, -0.12);
      sbox(s, b - 0.07, b, lo, hi, 0.07, fm, grp, reg, -0.12);
      sbox(s, a, b, lo, lo + 0.07, 0.07, fm, grp, reg, -0.12);
      sbox(s, a, b, hi - 0.07, hi, 0.07, fm, grp, reg, -0.12);
      sbox(s, (a + b) / 2 - 0.035, (a + b) / 2 + 0.035, lo, hi, 0.07, fm, grp, reg, -0.12);
      if (b - a > 1.2) sbox(s, a, b, hi - 0.45, hi - 0.38, 0.07, fm, grp, reg, -0.12);
      if (y0 > 2) { const gm = sbox(s, a, b, lo, hi, 0.02, glass, grp, false, -0.1); if (reg) { gm.userData = { glass: true, lvl: 2 }; wallMeshes.push(gm); } }
    }
  }
  cladPiece(s, cur, len, y0, y1, grp, reg);
}
const Wg = (a, b) => [a, b, SILL, WIN_TOP, 'w'];

// ---------- boshqaruv ----------
let view = 'eye', floorShown = 1, showLbl = true, low = false;
const views = {
  iso: [[W + 8, 17, H + 7], [W / 2, 0, H / 2 - 0.5]],
  top: [[W / 2, 30, (ZN + H) / 2 + 0.01], [W / 2, 0, (ZN + H) / 2]],
  eye: [[-16, 3.5, H + 6], [W / 2, 2.4, (ZN + H) / 2]],
  yard: [[W + 22, 6, H + 7], [W / 2 + 2, 1.8, 3]],
};
const ext = () => view === 'eye' || view === 'yard';
function refresh() {
  for (const m of wallMeshes) {
    const lvl = m.userData.lvl || 1;
    const cut = low && !ext() && lvl === floorShown;
    if (m.userData.glass) { m.visible = !cut; continue; }
    const { y0, h } = m.userData;
    const top = cut ? Math.min(y0 + h, (lvl === 2 ? U0 : 0) + 1.2) : y0 + h;
    m.visible = top > y0 + 0.001;
    if (m.visible) { m.scale.y = (top - y0) / h; m.position.y = y0 + (top - y0) / 2; }
  }
  upper.visible = upper2.visible = ext() || floorShown === 2;
  roof.visible = ext();
  for (const l of labels) l.visible = showLbl && !ext() && floorShown === 1;
  for (const l of labels2) l.visible = showLbl && !ext() && floorShown === 2;
  for (const [id, on] of [['bEye', view === 'eye'], ['bYard', view === 'yard'], ['bF1', !ext() && floorShown === 1], ['bF2', !ext() && floorShown === 2], ['bTop', view === 'top']])
    document.getElementById(id).classList.toggle('on', on);
  document.getElementById('bWalls').textContent = low ? 'Devorlar: kesilgan' : 'Devorlar: baland';
}
function setView(k, fl = floorShown) {
  const dy = fl === 2 && k !== 'eye' && k !== 'yard' ? U0 : 0;
  camera.position.set(views[k][0][0], views[k][0][1] + dy, views[k][0][2]);
  controls.target.set(views[k][1][0], views[k][1][1] + dy, views[k][1][2]);
  controls.update();
  view = k; floorShown = fl;
  refresh();
}
document.getElementById('bEye').onclick = () => setView('eye');
document.getElementById('bYard').onclick = () => setView('yard');
document.getElementById('bF1').onclick = () => { low = true; setView('iso', 1); };
document.getElementById('bF2').onclick = () => { low = true; setView('iso', 2); };
document.getElementById('bTop').onclick = () => { low = true; setView('top', ext() ? 1 : floorShown); };
document.getElementById('bWalls').onclick = () => { low = !low; refresh(); };
let raw = false;
document.getElementById('bRaw').onclick = (e) => {
  raw = !raw;
  e.target.classList.toggle('on', raw);
  furniture.visible = furniture2.visible = !raw;
  for (const f of floors) f.material.color.set(raw ? '#9d9a94' : f.userData.color);
  mat(WALL_C).color.set(raw ? '#b3aea4' : WALL_C);
};
document.getElementById('bLbl').onclick = (e) => {
  showLbl = !showLbl;
  e.target.classList.toggle('on', showLbl);
  refresh();
};

const params = new URLSearchParams(location.search);
const v0 = params.get('view') || 'eye';
low = params.get('walls') === 'low' || (!params.get('walls') && v0 !== 'eye' && v0 !== 'yard');
setView(v0, Number(params.get('floor') || 1));
if (params.get('raw')) document.getElementById('bRaw').click();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();
window.ready = true;
